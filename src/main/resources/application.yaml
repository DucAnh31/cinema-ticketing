server:
  port: 8080
spring:
  application:
    name: cinema-ticketing
  datasource:
    url: ${DBMS_CONNECTION}
    username: ${DBMS_USERNAME}
    password: ${DBMS_PASSWORD}
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
        one-indexed-parameters: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

